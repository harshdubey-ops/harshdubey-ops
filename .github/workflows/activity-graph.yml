name: Generate Activity Graph

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ashutosh00710/github-readme-activity-graph@v2.2.0
        with:
          github_username: harshdubey-ops
          theme: react-dark
          hide_border: true
          area: true
          output: github-activity-graph/graph.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update activity graph"
